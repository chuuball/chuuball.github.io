name: Auto-merge Tina CMS PRs

on:
  pull_request:
    branches: [main]

jobs:
  automerge:
    if: github.actor == 'tinabot' || startsWith(github.head_ref, 'tina/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Merge PR
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
